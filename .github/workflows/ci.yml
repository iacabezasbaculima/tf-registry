name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # Disables incremental compilation to save disk space

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --tests --examples -- -D warnings

  build:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      fail-fast: false # Don't cancel all jobs if one fails
      matrix:
        channel: [stable]
        os: [ubuntu, macos, windows]
        # Only run beta/nightly on ubuntu to save resources/space
        # include:
        #   - channel: beta
        #     os: ubuntu
        #   - channel: nightly
        #     os: ubuntu
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup default ${{ matrix.channel }}
      - name: Rust Cache # Automatically manages disk space for artifacts
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.os }}-${{ matrix.channel }}
      - name: Build
        run: cargo build --all-targets
      - name: Unit Tests
        run: cargo test --lib
      - name: Integration Tests
        run: cargo test --test integration
      # Uncomment if needed
      # - name: Clean up large artifacts
      #   if: always()
      #   run: cargo clean --doc # Removes documentation artifacts which can be large

  e2e:
    # Runs in a dedicated job (not the matrix) so it never competes with other jobs for the ngrok domain.
    # Tests within this job run in parallel — each test pools its own ngrok endpoint on the shared domain,
    # forwarding to its own local server port.
    runs-on: ubuntu-latest
    needs: build
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Rust
        run: rustup default stable
      - name: Rust Cache
        uses: swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ubuntu-stable
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - name: E2E Tests
        run: cargo test --test e2e
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY_BASE64: ${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PUBLIC_KEY_BASE64: ${{ secrets.GPG_PUBLIC_KEY_BASE64 }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
