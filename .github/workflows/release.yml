name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Publish release. Triggered manually via workflow_dispatch from the GitHub Actions UI.
  release-plz-release:
    if: ${{ github.repository_owner == 'iacabezasbaculima' && github.event_name == 'workflow_dispatch' }}
    name: Release-plz release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Push tags, and create releases.
      pull-requests: read # Detect the release PR and its commits.
      id-token: write # Required for OIDC token exchange
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `fetch-depth: 0` is needed to clone all the git history, which is necessary to
          # release from the latest commit of the release PR.
          fetch-depth: 0
          persist-credentials: false
      - &install-rust
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    if: ${{ github.repository_owner == 'iacabezasbaculima' && github.event_name == 'push' }}
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push to the pull request branch.
      pull-requests: write # Create and update pull requests.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *install-rust
      - name: Run release-plz
        uses: release-plz/action@064f4d1e36c843611ddf013be726beaa4ad804db # v0.5.129
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # In `release-plz-pr` this is only required if you are using a private registry.
          # CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
